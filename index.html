<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Character Hologram AI Agent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      background: radial-gradient(circle at 50% 45%, #071b34 0%, #020617 75%, #000000 100%);
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    #canvas-3d {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      touch-action: none;
    }

    .scanlines {
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(34, 211, 238, 0.035) 50%
      );
      background-size: 100% 4px;
    }

    /* Styling Markdown di Panel Output Bawah */
    .doc-content h1, .doc-content h2, .doc-content h3 {
      color: #67e8f9;
      font-weight: 700;
      margin-top: 0.75rem;
      margin-bottom: 0.35rem;
    }
    .doc-content h2 { font-size: 1.05rem; border-bottom: 1px solid rgba(34,211,238,0.25); padding-bottom: 2px; }
    .doc-content h3 { font-size: 0.95rem; }
    .doc-content p { margin-bottom: 0.5rem; line-height: 1.5; }
    .doc-content ul, .doc-content ol { margin-left: 1.25rem; margin-bottom: 0.5rem; list-style-type: disc; }
    .doc-content ol { list-style-type: decimal; }
    .doc-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.6rem 0;
      font-size: 0.8rem;
    }
    .doc-content th, .doc-content td {
      border: 1px solid rgba(34, 211, 238, 0.3);
      padding: 6px 8px;
      text-align: left;
    }
    .doc-content th {
      background-color: rgba(6, 182, 212, 0.2);
      color: #a5f3fc;
    }
    .doc-content strong { color: #e0f2fe; }
    .doc-content blockquote {
      border-left: 3px solid #22d3ee;
      padding-left: 0.75rem;
      color: #94a3b8;
      font-style: italic;
      margin: 0.5rem 0;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); }
    ::-webkit-scrollbar-thumb { background: rgba(34, 211, 238, 0.4); border-radius: 9999px; }
  </style>
</head>
<body class="text-cyan-50 flex flex-col justify-between relative select-none">

  <!-- Kanvas WebGL 3D (Hanya Wajah Hologram Karakter) -->
  <div id="canvas-3d"></div>

  <!-- Efek Garis Hologram Halus -->
  <div class="scanlines fixed inset-0 pointer-events-none z-10"></div>

  <!-- Header Minimalis -->
  <header class="w-full px-5 py-3.5 flex items-center justify-between z-20 pointer-events-auto">
    <div class="flex items-center gap-2.5">
      <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-cyan-400 shadow-[0_0_12px_#22d3ee]"></span>
      <div>
        <h1 class="text-xs font-bold tracking-[0.25em] text-cyan-300 uppercase">HOLOGRAM AI AGENT</h1>
        <p id="status-text" class="text-[11px] text-cyan-400/80">Siaga — Sentuh tombol mikrofon untuk bicara</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button id="toggle-doc-btn" class="hidden text-[11px] bg-cyan-950/85 hover:bg-cyan-900 text-cyan-200 border border-cyan-500/40 px-3 py-1.5 rounded-lg backdrop-blur-md transition">
        Tampilkan Hasil
      </button>
      <button id="fullscreen-btn" title="Layar Penuh" class="p-2 rounded-lg bg-slate-900/60 hover:bg-slate-800 border border-cyan-500/30 text-cyan-300 backdrop-blur-md transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
        </svg>
      </button>
    </div>
  </header>

  <!-- Area Tengah Transparan -->
  <div class="flex-1 flex flex-col justify-end items-center z-20 pointer-events-none pb-2">
    <div id="live-transcript" class="h-6 text-center text-xs text-cyan-200/90 italic max-w-lg truncate px-4 drop-shadow"></div>
  </div>

  <!-- Panel Dokumen Terstruktur (Muncul HANYA Saat Diperintahkan) -->
  <section id="document-panel" class="hidden z-30 w-full max-w-3xl mx-auto px-4 pb-3 pointer-events-auto">
    <div class="bg-slate-950/90 backdrop-blur-xl border border-cyan-400/40 rounded-2xl shadow-[0_-10px_40px_rgba(6,182,212,0.25)] flex flex-col max-h-[45dvh]">
      <div class="flex items-center justify-between px-4 py-2.5 border-b border-cyan-500/25 bg-cyan-950/50 rounded-t-2xl">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
          <span id="doc-title" class="text-xs font-bold tracking-wider text-cyan-200 uppercase">Dokumen Kerja AI Agent</span>
        </div>
        <div class="flex items-center gap-1.5">
          <button id="copy-doc-btn" class="text-[11px] bg-cyan-600/30 hover:bg-cyan-500/50 text-cyan-100 border border-cyan-400/30 px-2.5 py-1 rounded-md transition">
            Salin
          </button>
          <button id="download-doc-btn" class="text-[11px] bg-emerald-600/30 hover:bg-emerald-500/50 text-emerald-100 border border-emerald-400/30 px-2.5 py-1 rounded-md transition">
            Unduh
          </button>
          <button id="close-doc-btn" title="Tutup Panel" class="text-slate-400 hover:text-white p-1 ml-1">✕</button>
        </div>
      </div>
      <div id="doc-body" class="doc-content p-4 overflow-y-auto text-sm text-slate-200 select-text"></div>
    </div>
  </section>

  <!-- Kontrol Bawah -->
  <footer class="w-full py-4 px-4 flex flex-col items-center justify-center z-30 pointer-events-auto">
    <button id="mic-btn" class="group relative flex items-center justify-center gap-3 bg-cyan-500/20 hover:bg-cyan-500/35 active:scale-95 text-cyan-100 border border-cyan-400/60 px-7 py-3.5 rounded-full shadow-[0_0_25px_rgba(6,182,212,0.4)] backdrop-blur-md transition-all duration-200">
      <span id="mic-ping" class="hidden absolute inset-0 rounded-full border-2 border-rose-400 animate-ping opacity-60"></span>
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-cyan-300" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M7 4a3 3 0 016 0v4a3 3 0 11-6 0V4zm4 10.93A7.001 7.001 0 0017 8a1 1 0 10-2 0A5 5 0 015 8a1 1 0 00-2 0 7.001 7.001 0 006 6.93V17H6a1 1 0 100 2h8a1 1 0 100-2h-3v-2.07z" clip-rule="evenodd" />
      </svg>
      <span id="mic-label" class="text-sm font-semibold tracking-wide">Bicara dengan AI Agent</span>
    </button>
  </footer>

  <script>
    // ==========================================
    // 1. KONFIGURASI API KEY & OTAK AI AGENT
    // ==========================================
    const GEMINI_API_KEY = "MASUKKAN_API_KEY_GEMINI_ANDA_DI_SINI";

    const SYSTEM_PROMPT = `Kamu adalah AI Agent Hologram profesional untuk komunikasi suara dan asisten kerja.
Aturan respons wajib dalam format JSON murni tanpa markdown block:
{
  "spoken_reply": "Kalimat jawaban lisan dalam bahasa Indonesia yang natural, ramah, jelas, tanpa simbol aneh, maksimal 2-3 kalimat.",
  "show_document": true atau false,
  "document_title": "Judul singkat dokumen jika show_document true",
  "document_markdown": "Isi lengkap dalam format Markdown rapi (gunakan heading, poin, tabel, atau referensi sumber jika relevan) jika show_document true, atau string kosong jika false."
}

Kapan harus mengisi "show_document": true?
HANYA ketika pengguna secara eksplisit meminta:
1. Membuat rekapan pekerjaan / laporan / ringkasan kegiatan.
2. Memberikan informasi mendalam secara terstruktur lengkap dengan referensi / dasar aturan / langkah-langkah.
3. Membuat template pekerjaan (contoh: template surat dinas, SOP, tabel jadwal, format laporan, draf email, checklist kerja).

Jika pengguna hanya menyapa, mengobrol biasa, atau bertanya singkat yang cukup dijawab lisan, set "show_document": false dan kosongkan "document_markdown".`;

    // ==========================================
    // 2. ENGINE 3D KEPALA & WAJAH KARAKTER (THREE.JS)
    // ==========================================
    const container = document.getElementById('canvas-3d');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.05, 4.1);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Grup Kepala 3D (Hanya kepala, tanpa badan & tanpa lingkaran luar)
    const headGroup = new THREE.Group();
    scene.add(headGroup);

    const positions = [];
    const basePositions = [];
    const colors = [];
    const featureTypes = []; // 0: kulit wajah, 1: rambut, 2: kumis/jenggot/alis, 3: bibir
    const lipWeights = [];
    const jawWeights = [];

    // Pemetaan Silinder 3D Penuh (360 derajat kepala + wajah karakter)
    const uSteps = 160; // Resolusi horizontal sekeliling kepala
    const vSteps = 120; // Resolusi vertikal dari puncak rambut ke bawah dagu

    for (let iv = 0; iv <= vSteps; iv++) {
      const v = iv / vSteps; // 0 (puncak kepala) ke 1 (ujung dagu bawah)
      const phi = v * Math.PI; // 0 ke PI
      const yNorm = Math.cos(phi); // +1 (atas) ke -1 (bawah)

      for (let iu = 0; iu < uSteps; iu++) {
        const u = iu / uSteps;
        // theta = 0 adalah tepat di tengah depan wajah (sumbu +Z)
        const theta = (u - 0.5) * Math.PI * 2;
        const sinTheta = Math.sin(theta);
        const cosTheta = Math.cos(theta);

        // Potong bagian leher ke bawah agar murni HANYA KEPALA / WAJAH
        if (yNorm < -0.78) continue;
        // Bagian tengkuk belakang dipotong halus di atas batas leher
        if (cosTheta < -0.2 && yNorm < -0.45 + cosTheta * 0.25) continue;

        // Bentuk dasar cranium (tengkorak proporsional pria dewasa)
        let rx = 0.86;
        let ry = 1.18;
        let rz = 0.96;

        // Merampingkan rahang & dagu bagian bawah depan sesuai foto referensi
        if (yNorm < 0) {
          const jawFactor = Math.abs(yNorm);
          rx *= (1.0 - Math.pow(jawFactor, 1.8) * 0.34);
          if (cosTheta > 0) {
            rz *= (1.0 - Math.pow(jawFactor, 2.1) * 0.22);
          } else {
            // Bagian belakang rahang melengkung masuk ke bawah telinga
            rz *= (1.0 - Math.pow(jawFactor, 1.3) * 0.55);
          }
        }

        // Koordinat elipsoid dasar
        let x = rx * Math.sin(phi) * sinTheta;
        let y = ry * yNorm;
        let z = rz * Math.sin(phi) * cosTheta;

        let fType = 0; // Default: Permukaan wajah
        let lipW = 0;
        let jawW = 0;

        // ==========================================
        // PAHATAN ANATOMI WAJAH SESUAI FOTO REFERENSI
        // ==========================================
        if (cosTheta > -0.15) {
          // 1. Dahi lebar & rata natural (sesuai tampak depan & samping)
          const forehead = Math.exp(-Math.pow((yNorm - 0.36) / 0.18, 2)) * Math.exp(-Math.pow(theta / 0.55, 2));
          z += forehead * 0.055;

          // 2. Tulang Alis & Kelopak Mata (mata ramah & tajam khas karakter)
          const browMask = Math.exp(-Math.pow((yNorm - 0.16) / 0.045, 2)) * Math.exp(-Math.pow(theta / 0.48, 2));
          z += browMask * 0.065;

          // Cekungan rongga mata kiri (theta ~ -0.26) & kanan (theta ~ +0.26)
          const eyeSocketL = Math.exp(-(Math.pow((theta + 0.25) / 0.12, 2) + Math.pow((yNorm - 0.07) / 0.065, 2)));
          const eyeSocketR = Math.exp(-(Math.pow((theta - 0.25) / 0.12, 2) + Math.pow((yNorm - 0.07) / 0.065, 2)));
          z -= (eyeSocketL + eyeSocketR) * 0.11;

          // 3. Hidung (Batang hidung proporsional & cuping hidung sesuai profil samping)
          const noseBridge = Math.exp(-Math.pow(theta / 0.065, 2)) * Math.exp(-Math.pow((yNorm + 0.03) / 0.17, 2));
          const noseTip = Math.exp(-(Math.pow(theta / 0.075, 2) + Math.pow((yNorm + 0.14) / 0.065, 2)));
          const nostrilL = Math.exp(-(Math.pow((theta + 0.095) / 0.045, 2) + Math.pow((yNorm + 0.16) / 0.04, 2)));
          const nostrilR = Math.exp(-(Math.pow((theta - 0.095) / 0.045, 2) + Math.pow((yNorm + 0.16) / 0.04, 2)));
          z += noseBridge * 0.13 + noseTip * 0.165 + (nostrilL + nostrilR) * 0.065;

          // 4. Tulang Pipi & Pipi Penuh Natural (sesuai foto 3/4)
          const cheekL = Math.exp(-(Math.pow((theta + 0.36) / 0.18, 2) + Math.pow((yNorm + 0.07) / 0.15, 2)));
          const cheekR = Math.exp(-(Math.pow((theta - 0.36) / 0.18, 2) + Math.pow((yNorm + 0.07) / 0.15, 2)));
          z += (cheekL + cheekR) * 0.075;
          x += (cheekR - cheekL) * 0.045;

          // 5. Area Mulut, Bibir Atas & Bibir Bawah
          const upperLip = Math.exp(-(Math.pow(theta / 0.16, 2) + Math.pow((yNorm + 0.29) / 0.032, 2)));
          const lowerLip = Math.exp(-(Math.pow(theta / 0.145, 2) + Math.pow((yNorm + 0.365) / 0.035, 2)));
          const mouthLine = Math.exp(-(Math.pow(theta / 0.18, 2) + Math.pow((yNorm + 0.328) / 0.014, 2)));
          z += upperLip * 0.095 + lowerLip * 0.09 - mouthLine * 0.065;

          // Bobot animasi bicara pada bibir bawah & rahang
          lipW = Math.exp(-(Math.pow(theta / 0.21, 2) + Math.pow((yNorm + 0.37) / 0.065, 2)));
          if (yNorm < -0.32 && cosTheta > 0.2) {
            jawW = Math.min(1.0, Math.abs(yNorm + 0.32) * 2.1) * Math.exp(-Math.pow(theta / 0.45, 2));
          }

          // 6. Dagu Bulat Tegas (sesuai foto profil samping)
          const chin = Math.exp(-(Math.pow(theta / 0.16, 2) + Math.pow((yNorm + 0.56) / 0.1, 2)));
          z += chin * 0.11;

          // ==========================================
          // DETEKSI FITUR RAMBUT, ALIS, KUMIS & JENGGOT
          // ==========================================
          // Alis tebal rapi
          const browHairL = Math.exp(-(Math.pow((theta + 0.25) / 0.11, 2) + Math.pow((yNorm - 0.155) / 0.022, 2)));
          const browHairR = Math.exp(-(Math.pow((theta - 0.25) / 0.11, 2) + Math.pow((yNorm - 0.155) / 0.022, 2)));
          if (browHairL > 0.45 || browHairR > 0.45) fType = 2;

          // Kumis tipis di atas bibir atas (sesuai foto referensi)
          const mustache = Math.exp(-(Math.pow(theta / 0.17, 2) + Math.pow((yNorm + 0.245) / 0.024, 2)));
          if (mustache > 0.42 && Math.abs(theta) > 0.015) fType = 2;

          // Soul patch (rambut tipis tepat di bawah bibir bawah)
          const soulPatch = Math.exp(-(Math.pow(theta / 0.045, 2) + Math.pow((yNorm + 0.425) / 0.028, 2)));
          if (soulPatch > 0.45) fType = 2;

          // Jenggot tipis di bawah dagu (chinstrap tipis sesuai foto)
          const chinBeard = Math.exp(-(Math.pow(theta / 0.22, 2) + Math.pow((yNorm + 0.62) / 0.055, 2)));
          if (chinBeard > 0.42) fType = 2;
        }

        // 7. Telinga Kiri & Kanan (sesuai tampak samping kanan & kiri)
        const earL = Math.exp(-(Math.pow((theta + 1.52) / 0.14, 2) + Math.pow((yNorm + 0.04) / 0.16, 2)));
        const earR = Math.exp(-(Math.pow((theta - 1.52) / 0.14, 2) + Math.pow((yNorm + 0.04) / 0.16, 2)));
        if (earL > 0.25 || earR > 0.25) {
          const earPush = Math.max(earL, earR);
          x += Math.sign(theta) * earPush * 0.095;
          z -= earPush * 0.03;
        }

        // 8. Rambut Pendek Bergelombang Rapi (sesuai foto dari semua sudut)
        // Garis rambut (hairline) melengkung alami di dahi dan turun di cambang/belakang
        const hairlineY = 0.50 - 0.16 * Math.pow(Math.abs(theta) / 1.4, 1.5) - (cosTheta < 0 ? 0.85 : 0);
        if (yNorm > hairlineY && !(Math.abs(theta) > 1.35 && yNorm < 0.16)) {
          fType = 1;
          // Efek gelombang rambut alami (wavy hair texture)
          const wave = Math.sin(theta * 14 + yNorm * 18) * 0.014 + Math.cos(theta * 9 - yNorm * 12) * 0.012;
          const hairVolume = 0.048 + wave;
          x += Math.sin(phi) * sinTheta * hairVolume;
          y += Math.max(0, yNorm) * hairVolume * 0.9;
          z += Math.sin(phi) * cosTheta * hairVolume;
        }

        positions.push(x, y, z);
        basePositions.push(x, y, z);
        featureTypes.push(fType);
        lipWeights.push(lipW);
        jawWeights.push(jawW);
        colors.push(0.13, 0.83, 0.93);
      }
    }

    const headGeo = new THREE.BufferGeometry();
    headGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    headGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

    const headMat = new THREE.PointsMaterial({
      size: 0.022,
      vertexColors: true,
      transparent: true,
      opacity: 0.94,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const headPoints = new THREE.Points(headGeo, headMat);
    headGroup.add(headPoints);

    // Bola Mata 3D Realistis (Posisi sesuai proporsi mata di foto)
    const eyeGeo = new THREE.SphereGeometry(0.056, 24, 24);
    const eyeMat = new THREE.MeshBasicMaterial({
      color: 0xe0f2fe,
      transparent: true,
      opacity: 0.92
    });

    const leftEyeMesh = new THREE.Mesh(eyeGeo, eyeMat);
    leftEyeMesh.position.set(-0.22, 0.082, 0.83);
    headGroup.add(leftEyeMesh);

    const rightEyeMesh = new THREE.Mesh(eyeGeo, eyeMat);
    rightEyeMesh.position.set(0.22, 0.082, 0.83);
    headGroup.add(rightEyeMesh);

    // Pupil Mata Gelap-Kontras agar Tatapan Hidup
    const pupilGeo = new THREE.SphereGeometry(0.026, 16, 16);
    const pupilMat = new THREE.MeshBasicMaterial({ color: 0x020617 });
    const leftPupil = new THREE.Mesh(pupilGeo, pupilMat);
    leftPupil.position.set(0, 0, 0.042);
    leftEyeMesh.add(leftPupil);

    const rightPupil = new THREE.Mesh(pupilGeo, pupilMat);
    rightPupil.position.set(0, 0, 0.042);
    rightEyeMesh.add(rightPupil);

    // ==========================================
    // INTERAKSI PUTAR 360° (SENTUH / MOUSE)
    // ==========================================
    let isDragging = false;
    let prevPointer = { x: 0, y: 0 };
    let userOffsetRot = { x: 0, y: 0 };

    container.addEventListener('pointerdown', (e) => {
      isDragging = true;
      prevPointer = { x: e.clientX, y: e.clientY };
    });
    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = (e.clientX - prevPointer.x) * 0.006;
      const dy = (e.clientY - prevPointer.y) * 0.006;
      userOffsetRot.y = Math.max(-1.4, Math.min(1.4, userOffsetRot.y + dx));
      userOffsetRot.x = Math.max(-0.5, Math.min(0.5, userOffsetRot.x + dy));
      prevPointer = { x: e.clientX, y: e.clientY };
    });
    window.addEventListener('pointerup', () => { isDragging = false; });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ==========================================
    // 3. ANIMASI HIDUP WAJAH HOLOGRAM
    // ==========================================
    let currentState = 'idle'; // 'idle' | 'listening' | 'thinking' | 'speaking'
    let targetColor = new THREE.Color(0x22d3ee);
    let currentColor = new THREE.Color(0x22d3ee);
    let blinkScale = 1.0;

    function scheduleBlink() {
      let step = 0;
      const blinkTimer = setInterval(() => {
        step++;
        if (step <= 3) blinkScale = 0.06;
        else {
          blinkScale = 1.0;
          clearInterval(blinkTimer);
        }
      }, 32);
      setTimeout(scheduleBlink, Math.random() * 4200 + 2400);
    }
    setTimeout(scheduleBlink, 2000);

    const clock = new THREE.Clock();

    function animate3D() {
      requestAnimationFrame(animate3D);
      const t = clock.getElapsedTime();

      currentColor.lerp(targetColor, 0.08);
      eyeMat.color.copy(currentColor).lerp(new THREE.Color(0xffffff), 0.65);

      leftEyeMesh.scale.y += (blinkScale - leftEyeMesh.scale.y) * 0.45;
      rightEyeMesh.scale.y += (blinkScale - rightEyeMesh.scale.y) * 0.45;

      if (!isDragging) {
        userOffsetRot.x *= 0.96;
        userOffsetRot.y *= 0.96;
      }

      // Wajah diam tenang saat idle, bergerak luwes HANYA saat merespons suara
      let targetRotX = userOffsetRot.x;
      let targetRotY = userOffsetRot.y;
      let targetRotZ = 0;

      if (currentState === 'listening') {
        targetRotX += Math.sin(t * 2.2) * 0.045 - 0.03;
        targetRotY += Math.cos(t * 1.6) * 0.09;
        targetRotZ = Math.sin(t * 1.3) * 0.025;
      } else if (currentState === 'thinking') {
        targetRotX += -0.06 + Math.sin(t * 2.8) * 0.025;
        targetRotY += Math.sin(t * 2.4) * 0.14;
      } else if (currentState === 'speaking') {
        targetRotX += Math.sin(t * 4.4) * 0.05;
        targetRotY += Math.cos(t * 2.7) * 0.11;
        targetRotZ = Math.sin(t * 3.1) * 0.03;
      }

      headGroup.rotation.x += (targetRotX - headGroup.rotation.x) * 0.08;
      headGroup.rotation.y += (targetRotY - headGroup.rotation.y) * 0.08;
      headGroup.rotation.z += (targetRotZ - headGroup.rotation.z) * 0.08;

      const posAttr = headGeo.attributes.position;
      const colAttr = headGeo.attributes.color;

      const speechWave = currentState === 'speaking'
        ? Math.max(0, (Math.sin(t * 16) * 0.5 + Math.sin(t * 26) * 0.35 + Math.cos(t * 12) * 0.25 + 0.55))
        : 0;

      for (let i = 0; i < posAttr.count; i++) {
        const idx = i * 3;
        const bx = basePositions[idx];
        const by = basePositions[idx + 1];
        const bz = basePositions[idx + 2];
        const fType = featureTypes[i];

        let ny = by;
        let nz = bz;

        // Gerak mulut & dagu 3D sinkron saat berbicara
        if (currentState === 'speaking') {
          ny -= (lipWeights[i] * 0.075 + jawWeights[i] * 0.055) * speechWave;
          nz -= lipWeights[i] * 0.025 * speechWave;
          nz += Math.sin(by * 15 - t * 12) * 0.005 * speechWave;
        } else if (currentState === 'listening') {
          nz += Math.sin(by * 12 + t * 6) * 0.004;
        }

        posAttr.array[idx] = bx;
        posAttr.array[idx + 1] = ny;
        posAttr.array[idx + 2] = nz;

        // Kontras warna hologram antara kulit wajah, rambut, kumis, dan jenggot
        let shade = 0.55 + Math.max(0, nz) * 0.45;
        if (fType === 1) {
          // Rambut lebih pekat/kontras hologram
          shade *= 0.42;
        } else if (fType === 2) {
          // Kumis, alis, dan jenggot tipis lebih tegas
          shade *= 0.35;
        }

        colAttr.array[idx] = currentColor.r * shade;
        colAttr.array[idx + 1] = currentColor.g * shade;
        colAttr.array[idx + 2] = currentColor.b * shade;
      }

      posAttr.needsUpdate = true;
      colAttr.needsUpdate = true;

      renderer.render(scene, camera);
    }
    animate3D();

    // ==========================================
    // 4. KONTROL UI, FULLSCREEN & PANEL DOKUMEN
    // ==========================================
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const liveTranscript = document.getElementById('live-transcript');
    const micBtn = document.getElementById('mic-btn');
    const micLabel = document.getElementById('mic-label');
    const micPing = document.getElementById('mic-ping');

    const docPanel = document.getElementById('document-panel');
    const docTitle = document.getElementById('doc-title');
    const docBody = document.getElementById('doc-body');
    const toggleDocBtn = document.getElementById('toggle-doc-btn');
    const closeDocBtn = document.getElementById('close-doc-btn');
    const copyDocBtn = document.getElementById('copy-doc-btn');
    const downloadDocBtn = document.getElementById('download-doc-btn');
    const fullscreenBtn = document.getElementById('fullscreen-btn');

    let rawMarkdownContent = "";
    let currentDocTitle = "Dokumen_AI_Agent";
    let isSpeaking = false;

    function setAgentMode(mode) {
      currentState = mode;
      if (mode === 'listening') {
        targetColor.setHex(0xf43f5e);
        statusDot.className = 'w-2.5 h-2.5 rounded-full bg-rose-500 animate-ping';
        micPing.classList.remove('hidden');
      } else if (mode === 'thinking') {
        targetColor.setHex(0xfbbf24);
        statusDot.className = 'w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse';
        micPing.classList.add('hidden');
      } else if (mode === 'speaking') {
        targetColor.setHex(0x34d399);
        statusDot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-[0_0_12px_#34d399]';
        micPing.classList.add('hidden');
      } else {
        targetColor.setHex(0x22d3ee);
        statusDot.className = 'w-2.5 h-2.5 rounded-full bg-cyan-400 shadow-[0_0_12px_#22d3ee]';
        micPing.classList.add('hidden');
      }
    }

    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    function showDocumentPanel(title, markdownText) {
      currentDocTitle = title || "Dokumen Kerja AI Agent";
      rawMarkdownContent = markdownText;
      docTitle.textContent = currentDocTitle;
      docBody.innerHTML = marked.parse(markdownText);
      docPanel.classList.remove('hidden');
      toggleDocBtn.classList.add('hidden');
    }

    closeDocBtn.addEventListener('click', () => {
      docPanel.classList.add('hidden');
      if (rawMarkdownContent) toggleDocBtn.classList.remove('hidden');
    });

    toggleDocBtn.addEventListener('click', () => {
      docPanel.classList.remove('hidden');
      toggleDocBtn.classList.add('hidden');
    });

    copyDocBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(rawMarkdownContent);
      copyDocBtn.textContent = "Tersalin!";
      setTimeout(() => copyDocBtn.textContent = "Salin", 2000);
    });

    downloadDocBtn.addEventListener('click', () => {
      const blob = new Blob([rawMarkdownContent], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${currentDocTitle.replace(/\s+/g, '_')}.md`;
      a.click();
      URL.revokeObjectURL(url);
    });

    // ==========================================
    // 5. PENGENALAN SUARA & GEMINI AI AGENT
    // ==========================================
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'id-ID';
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        statusText.textContent = "Mendengarkan perintah Anda...";
        micLabel.textContent = "Mendengarkan...";
        liveTranscript.textContent = "";
        setAgentMode('listening');
      };

      recognition.onresult = async (event) => {
        const transcript = Array.from(event.results)
          .map(result => result[0].transcript)
          .join('');
        
        liveTranscript.textContent = `"${transcript}"`;

        if (event.results[0].isFinal) {
          statusText.textContent = "Memproses perintah...";
          micLabel.textContent = "Memproses...";
          setAgentMode('thinking');
          await processAgentCommand(transcript);
        }
      };

      recognition.onerror = (event) => {
        statusText.textContent = "Suara tidak terdeteksi (" + event.error + ")";
        resetToIdle();
      };

      recognition.onend = () => {
        if (!isSpeaking && statusText.textContent === "Mendengarkan perintah Anda...") {
          resetToIdle();
        }
      };
    } else {
      statusText.textContent = "Gunakan Google Chrome untuk fitur suara.";
      micBtn.disabled = true;
    }

    micBtn.addEventListener('click', () => {
      window.speechSynthesis.cancel();
      isSpeaking = false;
      try {
        recognition.start();
      } catch (e) {
        recognition.stop();
      }
    });

    async function processAgentCommand(userPrompt) {
      if (GEMINI_API_KEY === "MASUKKAN_API_KEY_GEMINI_ANDA_DI_SINI" || !GEMINI_API_KEY) {
        speakReply("Silakan masukkan API Key Gemini Anda di dalam kode terlebih dahulu.");
        return;
      }

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
            contents: [{ parts: [{ text: userPrompt }] }],
            generationConfig: {
              responseMimeType: "application/json"
            }
          })
        });

        const data = await response.json();
        const rawJson = data.candidates[0].content.parts[0].text;
        const parsed = JSON.parse(rawJson);

        if (parsed.show_document && parsed.document_markdown) {
          showDocumentPanel(parsed.document_title, parsed.document_markdown);
        }

        speakReply(parsed.spoken_reply || "Perintah telah selesai diproses.");

      } catch (error) {
        console.error(error);
        speakReply("Maaf, terjadi gangguan saat memproses perintah Anda.");
      }
    }

    function speakReply(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'id-ID';
      utterance.rate = 1.02;
      utterance.pitch = 1.0;

      utterance.onstart = () => {
        isSpeaking = true;
        statusText.textContent = "AI Agent sedang menjawab...";
        micLabel.textContent = "Interupsi Suara";
        setAgentMode('speaking');
      };

      utterance.onend = () => {
        isSpeaking = false;
        resetToIdle();
      };

      utterance.onerror = () => {
        isSpeaking = false;
        resetToIdle();
      };

      window.speechSynthesis.speak(utterance);
    }

    function resetToIdle() {
      statusText.textContent = "Siaga — Sentuh tombol mikrofon untuk bicara";
      micLabel.textContent = "Bicara dengan AI Agent";
      setAgentMode('idle');
    }
  </script>
</body>
</html>
